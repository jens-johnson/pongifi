#
# CodeQL workflow to perform GitHub-native static analysis. Findings land in the Security tab. Runs on PRs (changed
# files only; fast) and on a weekly schedule (full sweep).
#
# █████████████████████████████████████████████████████████████████████████████████████████████████████████████████████

name: 🔐 CodeQL

# Run on pushes + PRs to main and staging, 06:00 UTC every Monday
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  schedule:
    - cron: '0 6 * * 1'

# Jobs to be run
jobs:
  # Analyze project JS/TS files
  analyze:
    name: 🔎 Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
